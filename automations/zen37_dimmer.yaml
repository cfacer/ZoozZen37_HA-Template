# ══════════════════════════════════════════════════════════════════════════════
# Zooz ZEN37 800LR — Hold-to-Dim: TV Lights
# ══════════════════════════════════════════════════════════════════════════════
#
# SETUP: Before using this automation you need the device_id of your ZEN37.
#
#   1. Go to Developer Tools → Events in Home Assistant.
#   2. Listen for: zwave_js_value_notification
#   3. Press any button on the remote.
#   4. Copy the "device_id" value from the event data.
#   5. Replace every occurrence of YOUR_ZEN37_DEVICE_ID below with that value.
#
# USAGE:
#   Hold Button 1 (top large)    → brightness ramps UP
#   Hold Button 2 (middle large) → brightness ramps DOWN
#   Release either button        → brightness freezes at current level
#
# TUNING:
#   _light  — change to your light entity ID
#   _ttime  — seconds for a full 0 %→100 % traversal (default: 5)
#
# HOW IT WORKS (smoothing):
#   On hold, a single light.turn_on is issued with a proportional transition
#   toward the target (100 % up, 1 % down).  The automation then waits for
#   the matching KeyReleased event.  At release, brightness is calculated
#   mathematically from elapsed time (linear interpolation) rather than
#   polling the bulb, so freeze accuracy is independent of the bulb's
#   mid-transition state reporting capability.
# ══════════════════════════════════════════════════════════════════════════════

alias: "ZEN37 — Hold-to-Dim: TV Lights"
description: >
  Hold B1 to ramp up, hold B2 to ramp down; release freezes brightness.
  Brightness at release is estimated via linear interpolation over elapsed time.
mode: parallel
max: 10

variables:
  _light: light.tv_lights          # ← change if needed
  _ttime: 5                        # ← seconds for full 0 %→100 % range

trigger:
  # Button 1 (top large) held — dim UP
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: YOUR_ZEN37_DEVICE_ID    # ← replace
      command_class_name: "Central Scene"
      label: "Scene"
      property_name: "scene"
      property_key_name: "001"
      value: "KeyHeldDown"
    id: b1_held

  # Button 2 (middle large) held — dim DOWN
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: YOUR_ZEN37_DEVICE_ID    # ← replace
      command_class_name: "Central Scene"
      label: "Scene"
      property_name: "scene"
      property_key_name: "002"
      value: "KeyHeldDown"
    id: b2_held

action:
  # Capture brightness at trigger time for proportional ramp calculation.
  - variables:
      _bpct_start: >
        {{ (state_attr(_light, 'brightness') | float(0) / 2.55) | round(1) }}

  - choose:

      # ── BUTTON 1 HELD: ramp UP ─────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: b1_held
        sequence:
          - variables:
              _ramp_time: >
                {{ [(_ttime * (100.0 - _bpct_start) / 100.0) | round(2), 0.1] | max }}
              _t_start: "{{ now().timestamp() }}"

          - service: light.turn_on
            target:
              entity_id: "{{ _light }}"
            data:
              brightness_pct: 100
              transition: "{{ _ramp_time }}"

          - wait_for_trigger:
              - platform: event
                event_type: zwave_js_value_notification
                event_data:
                  device_id: YOUR_ZEN37_DEVICE_ID    # ← replace
                  command_class_name: "Central Scene"
                  label: "Scene"
                  property_name: "scene"
                  property_key_name: "001"
                  value: "KeyReleased"
            timeout:
              seconds: "{{ (_ramp_time + 2) | int }}"
            continue_on_timeout: true

          - variables:
              _elapsed: "{{ [now().timestamp() - _t_start, 0.0] | max }}"
              _freeze_pct: >
                {% set progress = (_elapsed / [_ramp_time, 0.1] | max) | min(1.0) %}
                {% set pct = _bpct_start + progress * (100.0 - _bpct_start) %}
                {{ [100, [pct | round(0) | int, 1] | max] | min }}

          - service: light.turn_on
            target:
              entity_id: "{{ _light }}"
            data:
              brightness_pct: "{{ _freeze_pct }}"
              transition: 0.1

      # ── BUTTON 2 HELD: ramp DOWN ───────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: b2_held
          - condition: template
            value_template: "{{ is_state(_light, 'on') and _bpct_start > 1 }}"
        sequence:
          - variables:
              _ramp_time: >
                {{ [(_ttime * (_bpct_start - 1.0) / 100.0) | round(2), 0.1] | max }}
              _t_start: "{{ now().timestamp() }}"

          - service: light.turn_on
            target:
              entity_id: "{{ _light }}"
            data:
              brightness_pct: 1
              transition: "{{ _ramp_time }}"

          - wait_for_trigger:
              - platform: event
                event_type: zwave_js_value_notification
                event_data:
                  device_id: YOUR_ZEN37_DEVICE_ID    # ← replace
                  command_class_name: "Central Scene"
                  label: "Scene"
                  property_name: "scene"
                  property_key_name: "002"
                  value: "KeyReleased"
            timeout:
              seconds: "{{ (_ramp_time + 2) | int }}"
            continue_on_timeout: true

          - variables:
              _elapsed: "{{ [now().timestamp() - _t_start, 0.0] | max }}"
              _freeze_pct: >
                {% set progress = (_elapsed / [_ramp_time, 0.1] | max) | min(1.0) %}
                {% set pct = _bpct_start - progress * (_bpct_start - 1.0) %}
                {{ [_bpct_start, [pct | round(0) | int, 1] | max] | min }}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ _freeze_pct <= 1 }}"
                sequence:
                  - service: light.turn_off
                    target:
                      entity_id: "{{ _light }}"
            default:
              - service: light.turn_on
                target:
                  entity_id: "{{ _light }}"
                data:
                  brightness_pct: "{{ _freeze_pct }}"
                  transition: 0.1
